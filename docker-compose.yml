services:
  postgres:
    image: postgres:17-alpine
    container_name: authorization-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-authorization}
      POSTGRES_USER: ${DB_USER:-authorization}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - authorization-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-authorization} -d ${DB_NAME:-authorization}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  authorization-postgres-data:
